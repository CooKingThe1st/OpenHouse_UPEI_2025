<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload to Raspberry Pi</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
      text-align: center;
    }
    input[type=file] {
      margin: 20px 0;
    }
    .upload-box {
      border: 2px dashed #999;
      border-radius: 10px;
      padding: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    .upload-box:hover {
      border-color: #333;
    }
  </style>
</head>
<body>
  <h2>Upload Files to Raspberry Pi</h2>

  <form method="post" enctype="multipart/form-data">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <p>Click or drag files here</p>
      <input id="fileInput" type="file" name="file" multiple onchange="uploadFiles(this.files)" hidden>
    </div>
  </form>

  <p id="status"></p>

  <script>
    async function uploadFiles(files) {
      const status = document.getElementById("status");
      for (const file of files) {
        status.textContent = `Uploading ${file.name}...`;
        const formData = new FormData();
        formData.append("file", file);
        try {
          const response = await fetch("/", { method: "POST", body: formData });
          const text = await response.text();
          status.textContent = `${file.name}: ${text}`;
        } catch (err) {
          status.textContent = `Error uploading ${file.name}`;
        }
      }
    }
  </script>
</body>
</html>
