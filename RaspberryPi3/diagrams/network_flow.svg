<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px}</style>
  <rect x="8" y="8" width="884" height="344" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="36" font-weight="bold">Network & control flow (OptiTrack -> Pi -> robot)</text>

  <!-- OptiTrack host -->
  <rect x="40" y="70" width="220" height="80" rx="6" fill="#f0f7ff" stroke="#7fb3ff"/>
  <text x="60" y="100" font-weight="bold">Motive / OptiTrack Host</text>
  <text x="60" y="122">NATNet / VRPN streaming</text>

  <!-- NATNet->TCP Bridge -->
  <rect x="300" y="70" width="220" height="80" rx="6" fill="#fff4e6" stroke="#ffbb66"/>
  <text x="320" y="100" font-weight="bold">NATNet->TCP Bridge</text>
  <text x="320" y="122">Publishes compact ASCII on TCP (e.g. 5400)</text>

  <!-- Demo host / GUI -->
  <rect x="560" y="40" width="260" height="60" rx="6" fill="#e9f9f0" stroke="#7fe0a5"/>
  <text x="580" y="70" font-weight="bold">Demo host / GUI</text>
  <text x="580" y="88" font-size="12">Connects to NATNet or bridge; displays pose and controls robots</text>

  <!-- Pi client -->
  <rect x="300" y="190" width="220" height="80" rx="6" fill="#f7fff0" stroke="#b7e27f"/>
  <text x="320" y="220" font-weight="bold">Raspberry Pi client</text>
  <text x="320" y="242">TCP socket client -> parses frames -> control Arduino/Zumo</text>

  <!-- HTTP upload server (optional) -->
  <rect x="560" y="140" width="260" height="60" rx="6" fill="#fff0f0" stroke="#ff9b9b"/>
  <text x="580" y="168" font-weight="bold">HTTP upload / control</text>
  <text x="580" y="186" font-size="12">server_rasp_upload + upload.html (dev flow)</text>

  <!-- arrows -->
  <line x1="260" y1="110" x2="300" y2="110" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <line x1="420" y1="150" x2="420" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <line x1="520" y1="110" x2="560" y2="70" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <line x1="520" y1="210" x2="560" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <line x1="420" y1="230" x2="420" y2="260" stroke="#333" stroke-width="2" marker-end="url(#a)" />

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333" />
    </marker>
  </defs>

  <text x="24" y="320" font-size="12" fill="#666">Notes: The TCP bridge is optional if clients use NATNet/VRPN directly. The HTTP upload is a developer convenience channel (one-way file upload + control).</text>
</svg>
