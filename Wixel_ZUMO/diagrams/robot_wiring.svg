<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <style>text{font-family:Arial,Helvetica,sans-serif;font-size:12px}</style>
  <rect x="6" y="6" width="888" height="368" rx="8" fill="#fff" stroke="#e6e6e6"/>
  <text x="24" y="30" font-weight="bold">Wixel + Zumo Robot — Physical Layout (conceptual)</text>

  <!-- Head -->
  <rect x="40" y="70" width="220" height="90" rx="6" fill="#f8f8ff" stroke="#b0b0ff"/>
  <text x="60" y="100" font-weight="bold">Head</text>
  <text x="60" y="118">OptiTrack Marker + RGB LED</text>

  <!-- Wixel -->
  <rect x="320" y="70" width="220" height="90" rx="6" fill="#fff8f0" stroke="#ffb380"/>
  <text x="340" y="100" font-weight="bold">Wixel Board</text>
  <text x="340" y="118">RF (master/slave) + USB for programming</text>

  <!-- Zumo -->
  <rect x="600" y="70" width="240" height="140" rx="6" fill="#f0fff4" stroke="#8fdf9a"/>
  <text x="620" y="100" font-weight="bold">Zumo Shield (motors + buzzer)</text>
  <text x="620" y="118">Motor driver, buzzer, power switch</text>
  <text x="620" y="136">Battery: 2300 mAh (shared)</text>

  <!-- arrows and links -->
  <line x1="260" y1="115" x2="320" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="115" x2="600" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="24" y="320" font-size="12" fill="#444">Notes: The exact pin wiring and connector mapping used in our builds is shown in</text>
  <text x="24" y="338" font-size="12" fill="#444">Wixel_ZUMO/slave/testing_apps/alpha/alpha.c — open that file for the ASCII wiring diagram and pin definitions.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333" />
    </marker>
  </defs>
</svg>
