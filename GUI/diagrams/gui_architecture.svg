<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px}</style>
  <rect x="8" y="8" width="984" height="404" rx="8" fill="#fff" stroke="#eee"/>
  <text x="28" y="36" font-weight="bold">GUI Architecture (Host GUI ↔ OptiTrack ↔ Serial/Wixel ↔ Robots)</text>

  <!-- OptiTrack host -->
  <rect x="40" y="70" width="220" height="80" rx="6" fill="#f0f8ff" stroke="#7fb3ff"/>
  <text x="60" y="100" font-weight="bold">OptiTrack / Motive Host</text>
  <text x="60" y="118" font-size="12">NATNet/bridge -> TCP stream</text>

  <!-- Network bridge -->
  <rect x="300" y="70" width="240" height="80" rx="6" fill="#fff4e6" stroke="#ffbb66"/>
  <text x="320" y="100" font-weight="bold">NATNet -> TCP Bridge</text>
  <text x="320" y="118" font-size="12">Publishes ASCII frames (e.g. 5400)</text>

  <!-- GUI host -->
  <rect x="620" y="40" width="320" height="120" rx="6" fill="#e8fff2" stroke="#7fe0a5"/>
  <text x="640" y="72" font-weight="bold">GUI Host (Player Laptop)</text>
  <text x="640" y="92" font-size="12">Runs the GUI app (legacy / Binh / Soroush / Minh versions)</text>
  <text x="640" y="110" font-size="12">Receives TCP frames & camera feed, sends serial commands</text>

  <!-- serial / wixel master -->
  <rect x="160" y="230" width="240" height="90" rx="6" fill="#fff7f0" stroke="#ff9b9b"/>
  <text x="180" y="258" font-weight="bold">Serial / Wixel Master</text>
  <text x="180" y="278" font-size="12">GUI -> Serial (USB/UART) -> Master Wixel</text>
  <text x="180" y="296" font-size="12">Master Wixel relays to Slave Wixels (RF)</text>

  <!-- Robots -->
  <rect x="520" y="240" width="240" height="90" rx="6" fill="#fff" stroke="#cfcfcf"/>
  <text x="540" y="268" font-weight="bold">Robots (Zumo + Arduino + Pi)</text>
  <text x="540" y="288" font-size="12">Slave Wixel -> onboard MCU -> motors</text>

  <!-- optional camera -->
  <rect x="40" y="310" width="200" height="70" rx="6" fill="#f7f7ff" stroke="#b0b0ff"/>
  <text x="60" y="338" font-weight="bold">Overhead/Onboard Camera</text>
  <text x="60" y="356" font-size="12">Optional: GUI integrates camera feed (Binh version)</text>

  <!-- arrows -->
  <line x1="260" y1="110" x2="300" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="120" x2="620" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="160" x2="760" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="520" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="340" x2="400" y2="170" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333" />
    </marker>
  </defs>

  <text x="24" y="400" font-size="12" fill="#666">Notes: Typical flow: OptiTrack -> Bridge -> GUI; GUI -> Serial -> Master Wixel -> Slave Wixels -> Robots. Camera feed is optional (Binh version).</text>
</svg>
