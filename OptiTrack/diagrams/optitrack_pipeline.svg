<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <style>
    .box { fill:#f7f9fc; stroke:#2b6cb0; stroke-width:2px; rx:8px; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#0b2447; }
    .arrow { stroke:#2b6cb0; stroke-width:2px; fill:none; marker-end:url(#arrowhead);} 
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>
  <!-- Boxes -->
  <rect x="20" y="40" width="160" height="80" class="box" />
  <text x="100" y="86" text-anchor="middle" class="label">Markers (real world)</text>

  <rect x="220" y="25" width="180" height="110" class="box" />
  <text x="310" y="86" text-anchor="middle" class="label">Camera System\n(IR LED & sensors)</text>

  <rect x="440" y="25" width="220" height="110" class="box" />
  <text x="550" y="86" text-anchor="middle" class="label">Host machine running Motive\n(Motive + NATNet/VRPN)</text>

  <rect x="700" y="25" width="160" height="110" class="box" />
  <text x="780" y="86" text-anchor="middle" class="label">Communication choice\n(NATNet / VRPN / NATNet->TCP)</text>

  <rect x="440" y="140" width="420" height="40" class="box" />
  <text x="650" y="168" text-anchor="middle" class="label">Laptop / Robot board (TCP client or VRPN/NATNet client)</text>

  <!-- Arrows -->
  <path class="arrow" d="M180 80 L220 80" />
  <path class="arrow" d="M400 80 L440 80" />
  <path class="arrow" d="M660 80 L700 80" />
  <path class="arrow" d="M560 135 L560 140" />
  <path class="arrow" d="M810 80 L700 80" stroke-dasharray="5,5" />

  <!-- Notes -->
  <text x="20" y="180" class="label">Diagram: markers -> camera -> Motive host -> communication -> robot/laptop</text>
</svg>
